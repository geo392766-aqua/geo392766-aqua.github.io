  CUR = {산불_위치:{위도:+lat.toFixed(5), 경도:+lon.toFixed(5)}, 기상:D.weather,

               "1시간_km":+(D.speed*60/1000).toFixed(2), "3시간_km":+(D.speed*180/1000).toFixed(2),
               "6시간_km":+(D.speed*360/1000).toFixed(2)},
         학교:{분석반경_km:D.radius, 등급별:cnt, 상위10:res.slice(0, 10)},
         경기도_산불대응장비:D.equip};

  const W = D.weather;
  document.getElementById('info').innerHTML =
    `<b>🔥 산불 분석</b> <span style="color:#888">(다시 클릭하면 위치 변경)</span><br>
     위치: ${lat.toFixed(4)}, ${lon.toFixed(4)}<br>
     풍속 ${W.WSD}m/s · 습도 ${W.REH}% · 기온 ${W.T1H}℃<br>
     확산 속도 <b>${D.speed.toFixed(1)} m/분</b> (${(D.speed*0.06).toFixed(2)} km/h) · 방향 ${dirTxt}<hr>
     반경 ${D.radius}km 학교 <b>${res.length}곳</b><br>
     <span style="color:red">●심각 ${cnt.심각}</span> <span style="color:orange">●경계 ${cnt.경계}</span>
     <span style="color:#c9a000">●주의 ${cnt.주의}</span> <span style="color:green">●관심 ${cnt.관심}</span><br>
     ${res.slice(0, 5).map(r => `· ${esc(r.이름)} (${r.도달_시간}h, ${r.등급})`).join('<br>')}<hr>
     <b>경기도 산불 대응 장비 TOP3</b><br>
     ${D.equip.slice(0, 3).map(e => `· ${esc(e.name)}: ${e.qty}`).join('<br>') || '-'}`;

  // 6시간 확산 애니메이션 (10분 × 36단계, 반복)
  const poly = L.polygon([], {weight:2}).addTo(layer);
  let i = 0;
  timer = setInterval(() => {
    i = i % 36 + 1; const h = i/6;
    const col = h <= 1 ? 'red' : h <= 3 ? 'orange' : 'yellow';
    const ring = []; for (let d = 0; d < 360; d += 10) ring.push(move(lat, lon, dirSpeed(d)*60*h/1000, d));
    poly.setLatLngs(ring).setStyle({color:col, fillColor:col, fillOpacity:.3});
    document.getElementById('clock').textContent =
      `발화 후 ${Math.floor(h)}시간 ${String(Math.round((h%1)*60)).padStart(2, '0')}분`;
  }, 400);
}

async function askClaude(){
  const out = document.getElementById('ai-out'), btn = document.getElementById('ai-btn');
  if (!CUR){ out.textContent = '먼저 지도를 클릭해 산불 위치를 정하세요.'; return; }
  btn.disabled = true; out.textContent = '분석 중... (10~30초)';
  const prompt = "다음 산불 상황 데이터를 분석해 주세요.\n" + JSON.stringify(CUR, null, 1);
  try {
    const res = await fetch(D.worker + '/v1/messages?base=' + encodeURIComponent(D.base), {
      method:'POST',
      headers:{'Content-Type':'application/json', 'Authorization':'Bearer ' + D.key,
               'anthropic-version':'2023-06-01'},
      body: JSON.stringify({model:D.model, max_tokens:1500, system:D.system,
                            messages:[{role:'user', content:prompt}]})});
    if (!res.ok) throw new Error(res.status + ' ' + (await res.text()).slice(0, 200));
    const d = await res.json();
    const text = (d.content && d.content[0] && d.content[0].text)
              || (d.choices && d.choices[0].message.content) || JSON.stringify(d);
    out.innerHTML = esc(text).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
  } catch(e){ out.textContent = '오류: ' + e.message; }
  btn.disabled = false;
}
</script></body></html>
